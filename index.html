<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>名雪薇薇ViVy 演唱記錄查詢</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-16 selection:bg-sky-500 selection:text-white">
  <!-- 頂部標題區 -->
  <header class="bg-slate-900/90 backdrop-blur border-b border-sky-500/20 py-10 px-6 text-center shadow-xl mb-8">
    <h1 class="text-5xl font-extrabold text-sky-400 tracking-wider mb-2 drop-shadow-[0_0_15px_rgba(56,189,248,0.3)]">👑 名雪薇薇ViVy 演唱記錄查詢 🤍</h1>
    <p class="text-slate-400 text-base">
      輸入歌名、原唱或歌回名稱秒查歷次演唱，點擊 ▶播放 直接前往 YouTube 聆聽
    </p>
    <div class="text-base text-gray-400 flex flex-wrap items-center justify-center gap-2 mt-2">
      <span>💠</span>
      <a href="https://www.youtube.com/@NayukiViVych" target="_blank" class="text-sky-400 hover:text-sky-300 font-semibold transition">名雪薇薇·ヴィヴィch.↗</a>
      <span>💠</span>
      <a href="https://twitter.com/Nayuki_Vivy" target="_blank" class="text-sky-400 hover:text-sky-300 font-semibold transition">twitter ↗</a>
      <span>💠</span>
      <a href="https://www.instagram.com/" target="_blank" class="text-sky-400 hover:text-sky-300 font-semibold transition">Instagram ↗</a>
      <span>💠</span>
      <a href="https://www.facebook.com/" target="_blank" class="text-sky-400 hover:text-sky-300 font-semibold transition">Facebook ↗</a>
      <span>💠</span>
      <a href="https://reurl.cc/5vXQjq" target="_blank" class="text-sky-400 hover:text-sky-300 font-semibold transition">Discord ↗</a>
      <span>💠</span>
      <a href="https://reurl.cc/DAGakN" target="_blank" class="text-sky-400 hover:text-sky-300 font-semibold transition">TikTok ↗</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 space-y-6">
    <!-- 搜尋與排序工具列 -->
    <div class="flex flex-col sm:flex-row gap-3 bg-slate-900/80 backdrop-blur p-4 rounded-2xl border border-sky-500/30 shadow-lg shadow-sky-950/20">
      <input type="text" id="searchInput" placeholder="🔍 搜尋歌名、原唱或歌回名稱 (例如：愛人錯過、告五人)..." class="flex-1 bg-slate-950/90 border border-slate-800 rounded-xl px-4 py-3 text-base focus:outline-none focus:border-sky-400 text-slate-200 placeholder-slate-500 transition">
      <select id="sortSelect" class="bg-slate-950/90 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sky-400 text-slate-200 transition">
        <option value="all">🏷️ 全部顯示</option>
        <option value="original">🎵 Original 原創曲</option>
        <option value="cover">🎵 Cover 翻唱</option>
        <option value="lang-zh">🎵 華語歌曲</option>
        <option value="lang-jp">🎵 日文歌曲</option>
        <option value="lang-en">🎵 英文歌曲</option>
        <option value="lang-other">🎵 其他語言</option>
        <option value="count">🔥 唱最多次優先</option>
        <option value="recent">📅 最近日期優先</option>
      </select>
    </div>

    <!-- 資料統計提示 -->
    <div class="flex justify-between items-center px-2 text-sm text-slate-400">
      <span>收錄歌曲數：<strong id="totalSongs" class="text-sky-400 text-sm">0</strong> 首</span>
      <span>總演唱次數：<strong id="totalRecords" class="text-sky-400 text-sm">0</strong> 次</span>
    </div>

    <!-- 歌曲清單顯示區 -->
    <div id="songList" class="space-y-4"></div>
  </main>

  <script src="songs.js"></script>
  <script>
    function render() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const sort = document.getElementById('sortSelect').value;

      const filtered = songsDatabase.filter(r => {
        const matchKeyword = r.title.toLowerCase().includes(keyword) || 
                             r.artist.toLowerCase().includes(keyword) || 
                             r.streamTitle.toLowerCase().includes(keyword);
        
        if (sort === "original") {
          return matchKeyword && (r.tag && r.tag.toLowerCase() === "original");
        }
        if (sort === "cover") {
          return matchKeyword && (r.tag && r.tag.toLowerCase() === "cover");
        }
        if (sort === "lang-zh") {
          return matchKeyword && (r.lang === "zh");
        }
        if (sort === "lang-jp") {
          return matchKeyword && (r.lang === "jp");
        }
        if (sort === "lang-en") {
          return matchKeyword && (r.lang === "en");
        }
        if (sort === "lang-other") {
          return matchKeyword && (r.lang === "other");
        }
        return matchKeyword;
      });

      const grouped = {};
      filtered.forEach(r => {
        if (!grouped[r.title]) {
          grouped[r.title] = { title: r.title, artist: r.artist, records: [] };
        }
        grouped[r.title].records.push(r);
      });

      let songArray = Object.values(grouped);

      if (sort === "count") {
        songArray.sort((a, b) => b.records.length - a.records.length);
      } else if (sort === "recent") {
        songArray.sort((a, b) => b.records[b.records.length - 1].date.localeCompare(a.records[a.records.length - 1].date));
      }

      document.getElementById('totalSongs').innerText = songArray.length;
      document.getElementById('totalRecords').innerText = filtered.length;

      const container = document.getElementById('songList');
      if (songArray.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-500 bg-slate-900/60 rounded-2xl border border-slate-800">找不到符合的歌曲</div>`;
        return;
      }

      container.innerHTML = songArray.map(song => `
        <div class="bg-slate-900/80 backdrop-blur border border-sky-500/20 rounded-2xl p-5 hover:border-sky-400/60 transition shadow-lg">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4">
            <div>
              <h3 class="text-2xl font-bold text-white tracking-wide">${song.title}</h3>
              <p class="text-base text-slate-400 mt-0.5">原唱：${song.artist || '未標註'}</p>
            </div>
            <span class="bg-sky-500/10 text-sky-300 text-xs px-3 py-1 rounded-full font-semibold border border-sky-500/20 self-start sm:self-auto">
              總共唱過 ${song.records.length} 次
            </span>
          </div>

          <div class="space-y-2 pt-3 border-t border-slate-800/80">
            ${song.records.map(rec => `
              <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 bg-slate-950/70 p-3 rounded-xl border border-slate-800/80 hover:border-sky-500/30 transition">
                <div class="space-y-1">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-sm text-sky-400 font-semibold">📅 ${rec.date}</span>
                    <span class="text-sm text-slate-300 font-medium">${rec.streamTitle}</span>
                  </div>
                </div>
                <div class="flex items-center gap-2 self-end sm:self-auto">
                  ${rec.tag ? `<span class="bg-pink-500/20 text-pink-300 px-2 py-0.5 rounded text-[10px] font-semibold">${rec.tag}</span>` : ''}
                  <a href="https://youtu.be/${rec.vid}${rec.sec > 0 ? '?t=' + rec.sec : ''}" target="_blank" 
                     class="inline-flex items-center gap-1.5 bg-sky-400 hover:bg-sky-300 text-slate-950 text-xs px-3.5 py-2 rounded-lg font-bold transition shadow-sm shadow-sky-500/20">
                    <span>▶ 播放 (${rec.time})</span>
                    <span>↗</span>
                  </a>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('sortSelect').addEventListener('change', render);
    render();
  </script>
</body>
</html>

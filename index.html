        const matchKeyword = r.title.toLowerCase().includes(keyword) || 
                             r.artist.toLowerCase().includes(keyword) || 
                             r.streamTitle.toLowerCase().includes(keyword);
        
        if (sort === "original") {
          return matchKeyword && (r.tag && r.tag.toLowerCase() === "original");
        }
         if (sort === "cover") {
          return matchKeyword && (r.tag && r.tag.toLowerCase() === "cover");
        }
        if (sort === "lang-zh") {
          return matchKeyword && (r.lang === "zh");
        }
        if (sort === "lang-jp") {
          return matchKeyword && (r.lang === "jp");
        }
        if (sort === "lang-en") {
          return matchKeyword && (r.lang === "en");
        }
        return matchKeyword;
      });

      const grouped = {};
      filtered.forEach(r => {
        if (!grouped[r.title]) {
          grouped[r.title] = { title: r.title, artist: r.artist, records: [] };
        }
        grouped[r.title].records.push(r);
      });

      let songArray = Object.values(grouped);

      if (sort === "count") {
        songArray.sort((a, b) => b.records.length - a.records.length);
      } else if (sort === "recent") {
        songArray.sort((a, b) => b.records[b.records.length - 1].date.localeCompare(a.records[a.records.length - 1].date));
      }

      document.getElementById('totalSongs').innerText = songArray.length;
      document.getElementById('totalRecords').innerText = filtered.length;

      const container = document.getElementById('songList');
      if (songArray.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-500 bg-slate-900/60 rounded-2xl border border-slate-800">找不到符合的歌曲 😢</div>`;
        return;
      }

      container.innerHTML = songArray.map(song => `
        <div class="bg-slate-900/80 backdrop-blur border border-sky-500/20 rounded-2xl p-5 hover:border-sky-400/60 transition shadow-lg">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4">
            <div>
              <h3 class="text-xl font-bold text-white tracking-wide">${song.title}</h3>
              <p class="text-xs text-slate-400 mt-0.5">原唱：${song.artist || '未標註'}</p>
            </div>
            <span class="bg-sky-500/10 text-sky-300 text-xs px-3 py-1 rounded-full font-semibold border border-sky-500/20 self-start sm:self-auto">
              總共唱過 ${song.records.length} 次
            </span>
          </div>

          <div class="space-y-2 pt-3 border-t border-slate-800/80">
            ${song.records.map(rec => `
              <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 bg-slate-950/70 p-3 rounded-xl border border-slate-800/80 hover:border-sky-500/30 transition">
                <div class="space-y-1">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-xs text-sky-400 font-semibold">📅 ${rec.date}</span>
                    <span class="text-xs text-slate-300 font-medium">${rec.streamTitle}</span>
                  </div>
                </div>
                <div class="flex items-center gap-2 self-end sm:self-auto">
                  ${rec.tag ? `<span class="bg-pink-500/20 text-pink-300 px-2 py-0.5 rounded text-[10px] font-semibold">${rec.tag}</span>` : ''}
                  <a href="https://youtu.be/${rec.vid}${rec.sec > 0 ? '?t=' + rec.sec : ''}" target="_blank" 
                     class="inline-flex items-center gap-1.5 bg-sky-400 hover:bg-sky-300 text-slate-950 text-xs px-3.5 py-2 rounded-lg font-bold transition shadow-sm shadow-sky-500/20">
                    <span>▶ 播放 (${rec.time})</span>
                    <span>↗</span>
                  </a>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('sortSelect').addEventListener('change', render);
    render();
  </script>
</body>
</html>
